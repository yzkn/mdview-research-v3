# v3 の PC 版の UI の検証（調査用。配る物には入らない）。
#
# 1. OS に近い見た目（ボタン・入力欄・ダイアログの寸法・字体・強調色・ボタンの並び）
# 2. メニューの幅を中身に合わせる（字の幅を測る）
# 3. メニューの階層（横へ開く下の階層）
# 4. macOS ではメニューを窓の中ではなく画面の上端（OS のメニューバー）に置く（muda）
#
# 本体と同じ iced 0.14 を使う（本体の自前のメニューへそのまま持ち込めるかを見るため）
[workspace]

[package]
name = "mdview-desktop-ui-poc"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
iced = { version = "0.14", features = ["advanced", "tokio"] }
# OS のダイアログと、自前で描いたダイアログを見比べる（本体と同じ版）
rfd = "0.17"
# 試作の画面を PNG に撮る（`POC_SHOT_DIR`。外からは画面を撮れないため）
image = { version = "0.25", default-features = false, features = ["png"] }

# 画面の上端のメニューバー（NSMenu）。Tauri の部品で、Windows・Linux（GTK）にも使えるが、
# **ここでは macOS だけ**（Windows・Linux は本体と同じく窓の中に自前で描く。設計の判断を変えない）
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"

# 強調色を OS から取る（Windows は DWM の色）。本体の windows-sys と同じ版
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.dev]
debug = "line-tables-only"

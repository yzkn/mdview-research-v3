[package]
name = "incparse-poc"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
poc-core = { path = "../core" }
ropey = "1.6"
# tree-sitter-md 0.5 が要求するのは ^0.26。最新の 0.27 を入れると解決できない。
tree-sitter = "0.26"
# Rust バインディング（MarkdownParser / MarkdownTree）は parser フィーチャの下にある。
tree-sitter-md = { version = "0.5", features = ["parser"] }
# 区間再解析の比較対象。出力用パーサをそのまま可視範囲に使えるかを見る。
comrak = "0.55"

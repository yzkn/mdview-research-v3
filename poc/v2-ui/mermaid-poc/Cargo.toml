[package]
name = "mermaid-poc"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# v1 と同じ mermaid 11.17.2 に追従している純 Rust 実装。alpha 版である点に注意。
merman = "0.8.0-alpha.6"
# merman が出す SVG を実際に画像へ落とせるかの確認に使う（画面・PDF の両方で必要）。
resvg = "0.45"
# サイト全体の Mermaid 設定（htmlLabels 等）を JSON で渡すため。
serde_json = "1"

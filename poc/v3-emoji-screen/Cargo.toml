# v3 の R-19（同梱する絵文字の字体を選ぶ）の検証（調査用。配る物には入らない）。
#
# 候補の字体を読み込み、本体と同じ iced 0.14 で**画面に色で描けるか**を見る（PDF は ../v3-pdf-emoji）。
# 字体の形式で描ける・描けないが分かれる見込み（COLRv0・COLRv1・CBDT）
[workspace]

[package]
name = "mdview-emoji-screen-poc"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
iced = { version = "0.14", features = ["advanced", "tokio"] }
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = "line-tables-only"

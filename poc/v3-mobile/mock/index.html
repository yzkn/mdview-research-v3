<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- interactive-widget: キーボードが出たら中身の高さを縮める（Android の Chrome・WebView。iOS は visualViewport で合わせる） -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>mdview モバイルの UI の試作</title>
<style>
/*
 * mdview v3 モバイルの UI の試作（調査用）。端末のブラウザーでもそのまま動く。
 * 状態は URL の # で選べる（#read・#toc・#search・#edit・#block・#full）。?kbd=1 でキーボードの位置の見本を出す（撮影用）
 */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3; --panel: #f6f6f7;
  --accent: #1f6feb; --accent-fg: #ffffff; --mark: #fff3a3; --scrim: rgba(0,0,0,.32);
  --bar-h: 56px; --top-h: 48px; --tap: 48px; --radius: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --kbd: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#16181c; --fg:#e8e8e8; --muted:#9a9a9a; --line:#2c2f36; --panel:#1f2228; --accent:#4c8dff; --mark:#5a4d00; --scrim: rgba(0,0,0,.55); }
}
:root[data-theme="dark"] { --bg:#16181c; --fg:#e8e8e8; --muted:#9a9a9a; --line:#2c2f36; --panel:#1f2228; --accent:#4c8dff; --mark:#5a4d00; --scrim: rgba(0,0,0,.55); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 17px/1.8 "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* 上の帯: 文書名だけ。下へ読むと隠れ、上へ戻すと出る（読む面を広く） */
#top { position: fixed; inset: 0 0 auto 0; height: calc(var(--top-h) + var(--safe-t)); padding: var(--safe-t) 8px 0;
  display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); z-index: 10; transition: transform .2s; }
#top.hide { transform: translateY(-100%); }
#top .name { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 8px; }
#top .state { font-size: 12px; color: var(--muted); }
.icon { width: var(--tap); height: var(--tap); display: grid; place-items: center; border-radius: 12px; font-size: 20px; }
.icon:active { background: var(--panel); }

/* 本文 */
main { padding: calc(var(--top-h) + var(--safe-t) + 12px) 18px calc(var(--bar-h) + var(--safe-b) + 24px); max-width: 760px; margin: 0 auto; }
main h1 { font-size: 1.55em; line-height: 1.4; margin: .6em 0 .4em; }
main h2 { font-size: 1.25em; line-height: 1.4; margin: 1.4em 0 .4em; padding-bottom: .2em; border-bottom: 1px solid var(--line); }
main p, main ul, main pre, main table { margin: .6em 0; }
main pre { background: var(--panel); padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 14px; line-height: 1.6; }
main code { font-family: ui-monospace, "Noto Sans Mono CJK JP", monospace; font-size: .9em; }
main table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 15px; }
main th, main td { border: 1px solid var(--line); padding: 6px 10px; white-space: nowrap; }
main mark { background: var(--mark); color: inherit; }
.block { position: relative; border-radius: 8px; transition: background .15s; }
/* 直す面: ブロックの境目を薄く見せ、触れたブロックを直す */
body.editing .block { outline: 1px dashed var(--line); outline-offset: 4px; margin-block: 10px; }
body.editing .block:active { background: var(--panel); }
body.editing .block::after { content: "✎"; position: absolute; right: -6px; top: -10px; font-size: 13px; color: var(--muted); }

#modechip { position: fixed; top: calc(var(--top-h) + var(--safe-t) + 6px); left: 50%; transform: translateX(-50%); z-index: 9;
  background: var(--accent); color: var(--accent-fg); font-size: 12px; padding: 4px 12px; border-radius: 999px; display: none; }
body.editing #modechip { display: block; }
body.editing.sheeting #modechip { display: none; }
.block { scroll-margin-top: calc(var(--top-h) + var(--safe-t) + 12px); }
/* 板を開いている間は下に余白を足す（短い文書でも、直すブロックを板の上へ送れる） */
body.sheeting main { padding-bottom: 80dvh; }

/* 下の帯: 親指の届く所に主な操作を置く（押せる大きさは 48px 以上） */
#bar { position: fixed; inset: auto 0 0 0; height: calc(var(--bar-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  display: flex; justify-content: space-around; align-items: center; background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(12px); border-top: 1px solid var(--line); z-index: 10; }
#bar button { min-width: 64px; height: var(--bar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font-size: 11px; color: var(--muted); }
#bar button b { font-size: 21px; font-weight: 400; line-height: 1.1; color: var(--fg); }
#bar button.main b { background: var(--accent); color: var(--accent-fg); border-radius: 16px; width: 56px; height: 32px; display: grid; place-items: center; font-size: 18px; }
#bar button.on { color: var(--accent); }

/* 下から出る板（目次・ブロックの編集・その他） */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: var(--kbd); background: var(--bg); z-index: 21; display: none;
  border-radius: var(--radius) var(--radius) 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); max-height: 70dvh;
  padding-bottom: calc(var(--safe-b) * (1 - min(1, var(--kbd-on, 0)))); flex-direction: column; }
.sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 4px; flex: none; }
.sheet h3 { margin: 4px 18px 8px; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
.open .scrim, .open.sheet { display: flex; }
.open.scrim { display: block; }

/* 目次 */
#toc ol { list-style: none; margin: 0; padding: 0 8px 12px; overflow: auto; }
#toc li a { display: flex; align-items: center; min-height: var(--tap); padding: 0 12px; border-radius: 10px; color: inherit; text-decoration: none; }
#toc li a.l2 { padding-left: 30px; font-size: 15px; }
#toc li a.here { background: var(--panel); color: var(--accent); font-weight: 600; }

/* 検索: 上に入力、下に前後の移動（親指で送る） */
#find { position: fixed; inset: 0 0 auto 0; padding: calc(var(--safe-t) + 6px) 10px 6px; display: none; gap: 6px; align-items: center;
  background: var(--bg); border-bottom: 1px solid var(--line); z-index: 11; }
#find input { flex: 1; height: 40px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 0 12px; }
body.searching #find { display: flex; }
#findnav { position: fixed; inset: auto 0 var(--kbd) 0; height: calc(var(--bar-h) + var(--safe-b)); padding-bottom: var(--safe-b); z-index: 12;
  display: none; justify-content: space-around; align-items: center; background: var(--bg); border-top: 1px solid var(--line); }
#findnav button { min-width: 64px; height: var(--bar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
#findnav button b { font-size: 20px; font-weight: 400; line-height: 1.1; color: var(--fg); }
#findnav .count { font-size: 13px; color: var(--muted); }
body.searching #findnav { display: flex; }
body.searching #bar { visibility: hidden; }
body.searching #top { visibility: hidden; }

/* ブロックの編集の板: 原文の入力欄と、キーボードの上の道具の帯 */
#editor { height: min(62dvh, calc(100dvh - var(--kbd) - var(--top-h) - var(--safe-t) - 96px)); max-height: none; }
#editor textarea { margin: 0 12px; flex: 1; min-height: 96px; resize: none; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--fg); padding: 10px 12px; font: 16px/1.6 ui-monospace, "Noto Sans Mono CJK JP", monospace; }
#editor .hint { font-size: 12px; color: var(--muted); margin: 6px 18px 0; }
.keys { display: flex; gap: 6px; padding: 8px 8px; border-top: 1px solid var(--line); margin-top: 8px; background: var(--bg); flex: none; align-items: center; }
.keys .scroll { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0;
  mask-image: linear-gradient(to right, #000 85%, transparent); }
.keys .scroll::-webkit-scrollbar { display: none; }
.keys button { flex: none; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 10px; background: var(--panel); font-size: 15px; }
.keys button.done { background: var(--accent); color: var(--accent-fg); font-weight: 600; min-width: 64px; }
.keys .sep { flex: none; width: 1px; background: var(--line); margin: 6px 2px; }
.pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--panel); }

/* 全文の編集（構造を大きく直すとき） */
#full { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: none; flex-direction: column; padding-top: var(--safe-t); }
#full.open { display: flex; }
#full header { height: var(--top-h); display: flex; align-items: center; padding: 0 6px; border-bottom: 1px solid var(--line); gap: 4px; }
#full header .name { flex: 1; font-size: 15px; font-weight: 600; padding-left: 6px; }
#full textarea { flex: 1; border: 0; padding: 12px 14px; resize: none; background: var(--bg); color: var(--fg); font: 16px/1.7 ui-monospace, "Noto Sans Mono CJK JP", monospace; }
#full .keys { margin-top: 0; padding-bottom: calc(8px + var(--safe-b) * (1 - min(1, var(--kbd-on, 0)))); margin-bottom: var(--kbd); }

/* 知らせ（取り消しの口） */
#toast { position: fixed; left: 12px; right: 12px; bottom: calc(var(--bar-h) + var(--safe-b) + 12px); background: #2a2d33; color: #fff; border-radius: 12px;
  padding: 10px 14px; display: none; align-items: center; justify-content: space-between; z-index: 25; font-size: 14px; }
#toast.open { display: flex; }
#toast button { color: #8fb6ff; font-weight: 600; min-height: 36px; padding: 0 8px; }

/* キーボードの位置の見本（撮影用。?kbd=1） */
#fakekbd { position: fixed; inset: auto 0 0 0; height: 290px; background: #d1d4da; z-index: 40; display: none; place-items: center; color: #555; font-size: 14px; }
body.fakekbd #fakekbd { display: grid; }

#side, #splitsrc { display: none; }
#top .wide { display: none; }

/* タブレットの横置き（900px 以上）: 目次を左に出したまま、直すときは原文とプレビューを並べる */
@media (min-width: 900px) {
  body { font-size: 17px; }
  #layout { display: grid; grid-template-columns: 280px 1fr; }
  #side { position: sticky; top: calc(var(--top-h) + var(--safe-t)); height: calc(100dvh - var(--top-h) - var(--safe-t)); overflow: auto;
    border-right: 1px solid var(--line); padding: 12px 8px; display: block !important; }
  #side h4 { margin: 4px 12px 8px; font-size: 13px; color: var(--muted); }
  #bar, #findnav { display: none !important; }
  body.searching #top { visibility: visible; }
  #find { left: auto; width: 460px; top: calc(var(--top-h) + var(--safe-t) + 8px); right: 16px; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  #top .wide { display: grid; }
  main { padding-bottom: 40px; }
  body.split #layout { grid-template-columns: 280px 1fr 1fr; }
  body.split #splitsrc { display: block; }
}
#splitsrc { position: sticky; top: calc(var(--top-h) + var(--safe-t)); height: calc(100dvh - var(--top-h) - var(--safe-t)); border-right: 1px solid var(--line); }
#splitsrc textarea { width: 100%; height: 100%; border: 0; resize: none; padding: 16px; background: var(--panel); color: var(--fg); font: 15px/1.7 ui-monospace, monospace; }
#side a { display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; color: inherit; text-decoration: none; font-size: 15px; }
#side a.l2 { padding-left: 28px; font-size: 14px; }
#side a.here { background: var(--panel); color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header id="top">
  <button class="icon" aria-label="ファイル">‹</button>
  <div class="name" id="docname">議事録 2026-10-27.md</div>
  <button class="icon wide" aria-label="検索" data-go="search">⌕</button>
  <button class="icon wide" aria-label="並べて直す" data-go="split">⇆</button>
  <button class="icon" aria-label="その他" data-go="more">⋯</button>
</header>

<div id="modechip">直す面: 直したいブロックを押す</div>
<div id="find">
  <button class="icon" data-go="read" aria-label="閉じる">✕</button>
  <input id="q" type="search" placeholder="文書の中を検索" value="IME" enterkeyhint="search">
</div>
<nav id="findnav">
  <button aria-label="前へ"><b>︿</b>前へ</button>
  <span class="count">2 / 5 件</span>
  <button aria-label="次へ"><b>﹀</b>次へ</button>
  <button aria-label="置換"><b>⇄</b>置換</button>
</nav>

<div id="layout">
  <nav id="side"><h4>目次</h4><div id="sidelist"></div></nav>
  <div id="splitsrc"><textarea id="splittext" spellcheck="false"></textarea></div>
  <main id="doc"></main>
</div>

<nav id="bar">
  <button data-go="toc"><b>☰</b>目次</button>
  <button data-go="search"><b>⌕</b>検索</button>
  <button data-go="edit" class="main" id="editbtn"><b>✎</b>直す</button>
  <button data-go="look"><b>Aa</b>表示</button>
  <button data-go="more"><b>⋯</b>その他</button>
</nav>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="toc">
  <div class="grip"></div>
  <h3>目次 <span class="pill">いまの見出し</span></h3>
  <ol id="toclist"></ol>
</section>

<section class="sheet" id="editor">
  <div class="grip"></div>
  <h3><span id="kind">段落を直す</span> <span class="pill" id="where">3 / 9 ブロック</span></h3>
  <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <div class="hint">原文（Markdown）をそのまま直す。日本語の変換中は書き戻さない</div>
  <div class="keys" id="keys">
    <div class="scroll">
      <button data-k="undo">↶</button><button data-k="left">←</button><button data-k="right">→</button>
      <span class="sep"></span>
      <button data-k="h"># 見出し</button><button data-k="ul">・ 箇条</button><button data-k="task">☐ 作業</button>
      <span class="sep"></span>
      <button data-k="b"><b>B</b></button><button data-k="code">`コード`</button><button data-k="link">🔗</button>
      <span class="sep"></span>
      <button data-k="out">⇤</button><button data-k="in">⇥</button>
    </div>
    <button data-k="done" class="done">完了</button>
  </div>
</section>

<section class="sheet" id="more">
  <div class="grip"></div>
  <h3>その他</h3>
  <ol style="list-style:none;margin:0;padding:0 8px 12px" id="morelist"></ol>
</section>

<section id="full">
  <header><button class="icon" data-go="read" aria-label="閉じる">✕</button><div class="name">全文を直す</div><span class="state">自動で保存</span></header>
  <textarea id="fulltext" spellcheck="false" autocapitalize="off"></textarea>
  <div class="keys"><div class="scroll"><button>↶</button><button>←</button><button>→</button><span class="sep"></span><button># 見出し</button><button>・ 箇条</button><button>☐ 作業</button><span class="sep"></span><button><b>B</b></button><button>🔗</button><span class="sep"></span><button>⇤</button><button>⇥</button></div><button class="done" data-go="read">完了</button></div>
</section>

<div id="toast"><span id="toastmsg">段落を直しました</span><button id="undo">元に戻す</button></div>
<div id="fakekbd">（ソフトウェアキーボードの位置の見本）</div>

<script>
// ---- 文書（ブロックごとの原文。本番は core の解析と、ブロックごとの HTML に置き換える）----
const blocks = [
  "# 議事録 2026-10-27",
  "参加: 開発 3 名・企画 1 名。**v3 のモバイル版**の方針を決めた。",
  "## 決めたこと",
  "- モバイルは**閲覧中心**とし、編集は原文を直す程度にする\n- PC 版は iced のまま、モバイルは WebView で描く\n- 日本語の IME は端末のものを使う",
  "## 宿題",
  "- [ ] 目次の板を試す\n- [ ] キーボードの上の道具の帯を試す\n- [x] 試作を CI で組む",
  "## 測ったこと",
  "|大きさ|描く時間|\n|---|---|\n|5 KB|4.5 ms|\n|301 KB|927 ms|",
  "```rust\nfn main() {\n    println!(\"mdview\");\n}\n```",
];
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
function render(src) {   // 見本の描き方（本番は core の export::html をブロックごとに使う）
  if (src.startsWith("```")) return "<pre><code>" + esc(src.split("\n").slice(1, -1).join("\n")) + "</code></pre>";
  const h = src.match(/^(#{1,6}) (.*)$/);
  if (h) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
  if (src.startsWith("|")) {
    const rows = src.split("\n").filter(r => !/^\|-/.test(r)).map(r => r.split("|").slice(1, -1));
    return "<table>" + rows.map((r, i) => "<tr>" + r.map(c => i ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>";
  }
  if (/^- /.test(src)) return "<ul>" + src.split("\n").map(l => {
    const t = l.replace(/^- /, "");
    const task = t.match(/^\[( |x)\] (.*)$/);
    return task ? `<li style="list-style:none;margin-left:-1.2em"><input type="checkbox" ${task[1] === "x" ? "checked" : ""}> ${inline(task[2])}</li>` : `<li>${inline(t)}</li>`;
  }).join("") + "</ul>";
  return "<p>" + inline(src) + "</p>";
}
const doc = document.getElementById("doc");
function draw() {
  doc.innerHTML = blocks.map((b, i) => `<div class="block" data-i="${i}">${render(b)}</div>`).join("");
  const q = document.body.classList.contains("searching") ? "IME" : "";
  if (q) doc.querySelectorAll("p, li").forEach(e => e.innerHTML = e.innerHTML.replaceAll(q, `<mark>${q}</mark>`));
  const heads = blocks.map((b, i) => [b.match(/^(#{1,2}) (.*)$/), i]).filter(([m]) => m);
  const item = ([m, i], n) => `<a href="#" class="l${m[1].length}${n === 1 ? " here" : ""}" data-jump="${i}">${esc(m[2])}</a>`;
  document.getElementById("toclist").innerHTML = heads.map((h, n) => "<li>" + item(h, n) + "</li>").join("");
  document.getElementById("sidelist").innerHTML = heads.map(item).join("");
  document.getElementById("splittext").value = blocks.join("\n\n");
}

// ---- 状態 ----
const $ = id => document.getElementById(id);
let current = null, before = null;
function closeAll() {
  for (const id of ["toc", "editor", "more", "scrim", "full"]) $(id).classList.remove("open");
  document.body.classList.remove("sheeting");
  document.body.classList.remove("searching");
}
function go(state, index) {
  closeAll();
  const body = document.body.classList;
  if (state === "toc") { $("toc").classList.add("open"); $("scrim").classList.add("open"); }
  if (state === "search") { body.add("searching"); }
  if (state === "edit") { body.toggle("editing"); }
  if (state === "split") { body.toggle("split"); }
  if (state === "more") { $("more").classList.add("open"); $("scrim").classList.add("open"); }
  if (state === "full") { $("fulltext").value = blocks.join("\n\n"); $("full").classList.add("open"); }
  if (state === "block") { body.add("editing"); openBlock(index ?? 3); }
  if (state === "read") { body.remove("editing"); }
  $("editbtn").classList.toggle("on", body.contains("editing"));
  draw();
}
function openBlock(i) {
  current = i; before = blocks[i];
  const src = $("src");
  src.value = blocks[i];
  $("kind").textContent = /^#/.test(blocks[i]) ? "見出しを直す" : /^- /.test(blocks[i]) ? "箇条書きを直す" : /^\|/.test(blocks[i]) ? "表を直す" : /^```/.test(blocks[i]) ? "コードを直す" : "段落を直す";
  $("where").textContent = `${i + 1} / ${blocks.length} ブロック`;
  $("editor").classList.add("open");
  // 板の高さに合わせて、直すブロックが板の上に見えるように送る
  document.body.classList.add("sheeting");
  requestAnimationFrame(() => doc.querySelector(`[data-i="${i}"]`)?.scrollIntoView({ block: "start" }));
  if (!location.search.includes("kbd")) src.focus({ preventScroll: true });
}

// ---- 日本語の変換中は書き戻さない（入力欄の値を変えると、変換中の字が消える）----
let composing = false;
const src = $("src");
src.addEventListener("compositionstart", () => composing = true);
src.addEventListener("compositionend", () => { composing = false; live(); });
src.addEventListener("input", e => { if (!composing && !e.isComposing) live(); });
function live() {   // 直しながら、本文のブロックも描き直す（入力欄そのものには触れない）
  if (current === null) return;
  blocks[current] = src.value;
  const el = doc.querySelector(`[data-i="${current}"]`);
  if (el) el.innerHTML = render(src.value);
}

// ---- キーボードの上の道具の帯: 押しても焦点を外さない（外すとキーボードが閉じる）----
document.querySelectorAll(".keys button").forEach(b => b.addEventListener("pointerdown", e => e.preventDefault()));
function wrap(before, after, placeholder) {
  const s = src.selectionStart, e = src.selectionEnd, sel = src.value.slice(s, e) || placeholder;
  src.setRangeText(before + sel + after, s, e, "end");
  src.setSelectionRange(s + before.length, s + before.length + sel.length);
  live();
}
function linePrefix(prefix, remove) {
  const s = src.selectionStart, start = src.value.lastIndexOf("\n", s - 1) + 1;
  if (remove) { if (src.value.startsWith(prefix, start)) src.setRangeText("", start, start + prefix.length, "end"); }
  else src.setRangeText(prefix, start, start, "end");
  live();
}
$("keys").addEventListener("click", e => {
  const k = e.target.closest("button")?.dataset.k; if (!k) return;
  ({ h: () => linePrefix("# "), ul: () => linePrefix("- "), task: () => linePrefix("- [ ] "),
     b: () => wrap("**", "**", "太字"), code: () => wrap("`", "`", "コード"), link: () => wrap("[", "](https://)", "リンク"),
     in: () => linePrefix("  "), out: () => linePrefix("  ", true),
     left: () => src.setSelectionRange(Math.max(0, src.selectionStart - 1), Math.max(0, src.selectionStart - 1)),
     right: () => src.setSelectionRange(src.selectionEnd + 1, src.selectionEnd + 1),
     undo: () => document.execCommand("undo"),
     done: () => finish() })[k]?.();
});
function finish() {
  const changed = current !== null && blocks[current] !== before;
  $("editor").classList.remove("open"); document.body.classList.remove("sheeting"); src.blur(); current = null;
  if (changed) { $("toast").classList.add("open"); setTimeout(() => $("toast").classList.remove("open"), 5000); }
}
$("undo").addEventListener("click", () => { /* 本番は文書の取り消しの履歴へ */ $("toast").classList.remove("open"); });

// ---- キーボードの高さに板を乗せる（iOS は CSS で取れないので visualViewport で受ける）----
function fitKeyboard() {
  const vv = window.visualViewport; if (!vv) return;
  const kbd = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty("--kbd", kbd + "px");
  document.documentElement.style.setProperty("--kbd-on", kbd > 0 ? 1 : 0);
}
visualViewport?.addEventListener("resize", fitKeyboard);
visualViewport?.addEventListener("scroll", fitKeyboard);

// ---- 押す ----
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); closeAll(); doc.querySelector(`[data-i="${j.dataset.jump}"]`)?.scrollIntoView({ behavior: "smooth" }); return; }
  const b = e.target.closest(".block");
  if (b && document.body.classList.contains("editing") && current === null) openBlock(+b.dataset.i);
});
$("scrim").addEventListener("click", () => { if (current !== null) finish(); closeAll(); });
// 読むときに長押しで「このブロックを直す」（直す面へ切り替えずに直す）
let press;
doc.addEventListener("pointerdown", e => { const b = e.target.closest(".block"); if (!b) return; press = setTimeout(() => { document.body.classList.add("editing"); openBlock(+b.dataset.i); }, 550); });
for (const ev of ["pointerup", "pointercancel", "pointermove"]) doc.addEventListener(ev, () => clearTimeout(press));
// 下へ読むと上の帯を隠す
let lastY = 0;
addEventListener("scroll", () => { $("top").classList.toggle("hide", scrollY > lastY && scrollY > 80); lastY = scrollY; }, { passive: true });

$("morelist").innerHTML = ["全文を直す|full", "ファイルを開く|", "PDF に出力|", "HTML に出力|", "共有|", "設定|"].map(t => {
  const [label, go] = t.split("|");
  return `<li><a href="#" ${go ? `data-go="${go}"` : ""} style="display:flex;align-items:center;min-height:48px;padding:0 12px;border-radius:10px;color:inherit;text-decoration:none">${label}</a></li>`;
}).join("");

const split = $("splittext");
let splitComposing = false;
split.addEventListener("compositionstart", () => splitComposing = true);
split.addEventListener("compositionend", () => { splitComposing = false; splitLive(); });
split.addEventListener("input", e => { if (!splitComposing && !e.isComposing) splitLive(); });
function splitLive() {
  blocks.splice(0, blocks.length, ...split.value.split(/\n{2,}/).filter(b => b.trim()));
  doc.innerHTML = blocks.map((b, i) => `<div class="block" data-i="${i}">${render(b)}</div>`).join("");
}

// 撮影用: # で状態、?kbd=1 でキーボードの見本、?theme=dark で暗い配色
const params = new URLSearchParams(location.search);
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
if (params.get("kbd")) { document.body.classList.add("fakekbd"); document.documentElement.style.setProperty("--kbd", "290px"); document.documentElement.style.setProperty("--kbd-on", 1); }
draw();
const state = location.hash.slice(1);
if (state) go(state === "block" ? "block" : state, 3);
</script>
</body>
</html>

[package]
name = "mdview-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "mdview の UI に依存しない部分（v3 のモバイル対応の検証）"

# 依存は本体の Cargo.toml から、UI・OS の窓まわり（iced・rfd・dark-light・arboard）と MCP（rmcp・hyper 一式）を除いたもの
[dependencies]
iced = { path = "../iced-shim" }
ropey = "1.6"
unicode-linebreak = "0.1"
lru = "0.18"
comrak = { version = "0.55", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
merman = "0.9.0"
resvg = "0.45"
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip", "win-system-proxy"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "net", "time", "macros"] }
latex-rust = "2.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
encoding_rs = "0.8"
krilla = "0.8"
similar = { version = "3.2.0", features = ["inline"] }
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Shell"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
boa_engine = { version = "0.22", default-features = false }

[dev-dependencies]
boa_engine = { version = "0.22", default-features = false }

# iced 0.14 を、本体と同じ機能のまま Android 向けに組めるかを見る（v3 のモバイル対応の検証）。
# **型だけの iced（../iced-shim）と名前がぶつかるので、別の作業場にする**
[workspace]

[package]
name = "iced-android-check"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
iced = { version = "0.14", features = ["advanced", "tokio", "image-without-codecs"] }

# **起動の方式はアプリが選ぶ**（winit が使う android-activity は、どちらかの機能が無いと組めない。2026-10-28 に CI で踏んだ）。
# Java・Kotlin を書かずに済む native-activity にする
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

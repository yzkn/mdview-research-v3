# v3 の PC 版の UI の検証（調査用。本体の CI とは別）。
#
# macOS で、OS のメニュー（画面の上端のメニューバー）を組めるか・試作が起動するかを見る。
# 手元に Mac が無いので、**画面全体を撮って成果物に残す**（メニューバーは窓の写真に入らないため）。
# 試作の窓の写真は、試作が自分で撮る（`POC_SHOT_DIR`）
name: v3 desktop UI PoC

on:
  workflow_dispatch:
  # 枝の名前は決めない（非公開の本体と、公開用のリポジトリの両方で流す）
  push:
    paths:
      - "poc/v3-desktop-ui/**"
      - ".github/workflows/v3-desktop-ui-poc.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: poc/v3-desktop-ui
    steps:
      - uses: actions/checkout@v7

      - name: Rust を用意する
        # 版数はリポジトリの rust-toolchain.toml に従う
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc/v3-desktop-ui -> target
          key: desktop-ui

      - name: "1. 試作を組む（muda で OS のメニュー）"
        id: build
        continue-on-error: true
        run: cargo build 2>&1 | tail -30

      - name: "2. 起動して、窓の写真と画面全体の写真を撮る"
        id: run
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p out
          POC_SHOT_DIR="$PWD/out" ./target/debug/mdview-desktop-ui-poc > out/run.log 2>&1 &
          app=$!
          sleep 6
          # 画面の上端のメニューバーごと撮る（撮れないランナーもある。撮れなくても先へ進む）
          screencapture -x out/screen.png || echo "画面全体は撮れなかった" >> out/run.log
          wait "$app" || echo "試作の終わり方: $?" >> out/run.log
          cat out/run.log
          ls -l out
          grep -q "OS のメニューを組んだ" out/run.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mdview-v3-desktop-ui-macos
          path: poc/v3-desktop-ui/out/
          if-no-files-found: ignore
          retention-days: 14

      - name: 要約
        if: always()
        run: |
          {
            echo "## macOS（PC 版の UI の試作）"
            echo "|段|結果|"
            echo "|---|---|"
            echo "|1. 組む（muda）|${{ steps.build.outcome }}|"
            echo "|2. 起動して OS のメニューを組む・写真を撮る|${{ steps.run.outcome }}|"
          } >> "$GITHUB_STEP_SUMMARY"

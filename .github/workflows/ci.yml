name: CI

# v2.0.0 の検査（基本設計書 §27.2）。
#
# **既定は Linux だけにする。** private リポジトリでは実行分が課金され、
# **倍率が OS で違う**（Linux ×1 / Windows ×2 / macOS ×10。基本設計書 §27.9）。
# 3 OS を 1 回回すと約 119 分を使い、無料枠は月に 10 数回で尽きる。
#
#   - PR: **Linux の検査だけ**（約 8 分）。組まない・包まない・リリースしない
#   - main への push: **Linux の検査だけ**（同上）
#   - 手動起動: 選んだ OS で検査する。**Linux 以外を選んだら、組んで包み、本体の Release を作る**
#
#     |選ぶもの|検査|リリース|
#     |---|---|---|
#     |linux（既定）|Linux|しない|
#     |windows|Windows|する|
#     |linux-windows|Linux・Windows|する|
#     |all|3 OS|する|
#
# **あとから OS を足せる**（2026-10-15）: 手で起動するときに「足す先の Release」（例 `v2.2.1a`）を
# 書くと、新しく作らずにその Release へ載せる。`linux` を選べば Linux 版だけを組んで足す。
# **そのタグとアプリのソースが同じときだけ**（違うソースの物を混ぜない。CI や文書だけを直した
# コミットからは足せる）。照合値と説明文は作り直す
#
# **本体のタグと Release は、手で起動したときだけ作る**（2026-10-15）。2026-10-13 に
# 本体の Release（退避路）をやめたが、利用者が明示的に起動したときに限って戻した。
# **公開側の Release と名前で区別する**: タグと Release の名前は版数に英字を付ける
# （`v2.2.1a`。同じ版数で作り直すと `v2.2.1b`、`c` …）。公開側は `v2.2.1`。
#
# 組み立て・包み・煙試験・リリースの段は、公開側の ci.yml（migration-v2/.github/workflows/ci.yml。
# 手書き）から写した。**どちらかを直したら、もう片方にも手で入れる**

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "検査する OS（linux 以外は、組んで包み、本体の Release を作る）"
        type: choice
        default: linux
        options:
          - linux
          - windows
          - linux-windows
          - all
      append_to:
        description: "あとから足す先の本体の Release（例 v2.2.1a。アプリのソースが同じときだけ）。空なら新しく作る。足すときは linux も組む"
        type: string
        default: ""

# **手で起動したリリースは打ち切らない**（2026-10-15）。打ち切ると、下書きの Release や
# 成果物が欠けたまま残る。push と PR は、同じブランチの新しい実行で古いものを打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 検査（${{ matrix.label }}）
    runs-on: ${{ matrix.os }}
    env:
      # **組んで包むのは、手で起動して Linux 以外を選んだときだけ**（費用を抑える）
      # 足す先を書いたときは linux でも組む
      PACKAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.os != '' && (github.event.inputs.os != 'linux' || github.event.inputs.append_to != '') }}
      # **組み方**（2026-10-16）。配るときだけ `dist`（fat LTO。実行ファイルが小さいが、組み立てが
      # 2〜3 倍かかる）。普段の検査は `release`（thin）。試験するのは、包む物と同じ組み方のもの
      PROFILE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.os != '' && (github.event.inputs.os != 'linux' || github.event.inputs.append_to != '')) && 'dist' || 'release' }}
    strategy:
      fail-fast: false
      matrix:
        # **OS は手で起動したときに選ぶ**（§27.9）。押していないとき（push・PR）は Linux だけ。
        #
        # 以前はこれを決めるためだけに別のジョブを置いていたが、
        # **ジョブは 1 分未満でも 1 分として課金される。** 式で足りる。
        #
        # `github.event.inputs` はどの引き金でも参照でき、押していないときは空になる。
        #
        # **Linux は ubuntu-24.04 に固定する**（公開側と同じ。latest が変わると、組んだ
        # 実行ファイルが要求する glibc が上がる）
        include: ${{ fromJSON(
          github.event.inputs.os == 'windows' && '[{"os":"windows-latest","label":"windows-x86_64","target":"x86_64-pc-windows-msvc","binary":"mdview.exe"}]'
          || github.event.inputs.os == 'linux-windows' && '[{"os":"ubuntu-24.04","label":"linux-x86_64","target":"x86_64-unknown-linux-gnu","binary":"mdview"},{"os":"windows-latest","label":"windows-x86_64","target":"x86_64-pc-windows-msvc","binary":"mdview.exe"}]'
          || github.event.inputs.os == 'all' && '[{"os":"ubuntu-24.04","label":"linux-x86_64","target":"x86_64-unknown-linux-gnu","binary":"mdview"},{"os":"windows-latest","label":"windows-x86_64","target":"x86_64-pc-windows-msvc","binary":"mdview.exe"},{"os":"macos-latest","label":"macos-aarch64","target":"aarch64-apple-darwin","binary":"mdview"}]'
          || '[{"os":"ubuntu-24.04","label":"linux-x86_64","target":"x86_64-unknown-linux-gnu","binary":"mdview"}]') }}

    steps:
      - uses: actions/checkout@v7

      # **Linux のランナーの空きを広げる**（2026-10-20）。1 つのジョブで dist・dev・test の 3 通りに
      # 組み、deb と AppImage を包み、まっさらな環境（docker）で入れて試すため、2026-10-19 の
      # 本体の手動起動で「まっさらな環境で deb を起動する」の段が空き 61 MB で落ちた。
      # ランナーに入っていて使わない道具（.NET・Android・GHC・CodeQL）を消す（20 GB 以上空く見込み。前後の df で確かめる）
      - name: ランナーの空きを広げる（Linux）
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # **公開用の複製（migration-v2/）が最新か**（2026-10-13）。
      #
      # 公開側へは、公開用 PC で公開側の clone に migration-v2/ の中身だけを置き、
      # コミットして push する。向こうでは作り直せないので、**作り直し忘れのまま push すると
      # 古いものがそのまま公開される。** ここで作り直して、差分が出たら落とす
      #
      # **Dependabot の PR では見ない。** 依存を上げる PR は Cargo.lock を変えるが、複製
      # （migration-v2/Cargo.lock）は作り直さないので、毎回ここで落ちる。取り込んだあとの
      # main では落ちるままにする（配る前に作り直す合図）
      - name: 公開用の複製が最新か
        if: runner.os == 'Linux' && github.actor != 'dependabot[bot]'
        run: |
          python3 tools/build-public-copy.py
          # **索引に載せてから比べる**（2026-10-15）。`git status` は改行の違い（取り出した
          # CRLF と書いた LF）だけでも「変わった」と出し、6f75c31 から一度も通らなかった。
          # 載せると .gitattributes どおりにそろうので、中身の違いだけが残る（増えたものも拾う）
          git add -A -- migration-v2
          changed=$(git diff --cached --name-status -- migration-v2)
          if [ -n "$changed" ]; then
            echo "公開用の複製が古い。手元で python tools/build-public-copy.py を実行してコミットする:"
            echo "$changed" | head -50
            exit 1
          fi
          echo "公開用の複製は最新"

      - name: Rust ツールチェーンを用意する
        # 版数は rust-toolchain.toml に従う
        run: |
          rustup show
          rustup component add rustfmt clippy
          rustup target add ${{ matrix.target }}

      - name: Linux のビルド依存を入れる
        if: runner.os == 'Linux'
        # iced（wgpu / winit）が X11 と Wayland のヘッダを要求する
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev pkg-config

      # **同梱フォントはリポジトリに無い**（21.56MB あるため。assets/README.md）。
      # 版を固定してあるので、鍵にはその取得スクリプトを使う
      - name: 同梱フォントのキャッシュ
        id: fonts
        uses: actions/cache@v6
        with:
          path: assets/fonts
          key: fonts-${{ hashFiles('tools/fetch-fonts.py') }}

      - name: 同梱フォントを取得する
        if: steps.fonts.outputs.cache-hit != 'true'
        # 配布 zip は計 514MB あるが、必要な 4 エントリだけを Range 要求で取る
        # （12.8MB）。取得後は SHA256 で照合する
        run: python tools/fetch-fonts.py

      - name: 同梱フォントを確認する
        # キャッシュから復元した場合もここを通す。欠けたままビルドすると
        # include_bytes! で落ち、原因が分かりにくい
        run: python tools/fetch-fonts.py --check

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # **作ったアイコンを使い回す**（2026-10-20。B 案）。材料（SVG・作る example・依存の版）が
      # 同じなら、できるものも同じ。当たれば example を組む・つなぐ（fat LTO）時間を丸ごと省く
      - name: アイコンのキャッシュ
        id: icons
        if: env.PACKAGE == 'true'
        uses: actions/cache@v6
        with:
          path: assets/icons
          key: icons-${{ runner.os }}-${{ hashFiles('assets/icon.svg', 'assets/icon-small.svg', 'assets/icon-doc.svg', 'examples/make-icons.rs', 'Cargo.lock') }}

      # **配るときは検査より先に作る**（公開側と同じ）。`build.rs` が Windows の実行ファイルへ
      # 埋めるため、組む時点で `assets/icons/mdview.ico` が要る。無いと黙って埋めずに通る。
      # 検査だけのときは作らない（費用を抑える。試験はアイコンに依らない）
      # **ビルドと同じ組み方で作る。** example も本体の依存を全部組むので、組み方が違うと依存を
      # 2 回組む（release で作っていたとき、Windows で約 13 分余計にかかった。2026-10-16）
      - name: アイコンを作る
        if: env.PACKAGE == 'true' && steps.icons.outputs.cache-hit != 'true'
        run: cargo run --profile ${{ env.PROFILE }} --target ${{ matrix.target }} --example make-icons

      - name: 書式
        run: cargo fmt --all --check

      # **依存の著作権表示の一覧が最新か**（v2.6.0 R-01）。実行ファイルに埋めて About で見せる一覧で、
      # 依存を変えたのに作り直し忘れると古い一覧のまま配ってしまう。Linux だけで見る（OS を問わず同じ一覧）
      - name: 著作権表示の一覧が最新か
        if: runner.os == 'Linux' && github.actor != 'dependabot[bot]'
        run: python3 tools/build-licenses.py --check

      - name: Lint
        # **土台（core/）も見る**（v3 R-01 で作業場を 2 つのクレートにした。--workspace が無いと本体しか見ない）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: テスト
        # レイアウト層は描画層に依存しないため、ウィンドウ無しで試験できる
        # （基本設計書 §22.1）。**画面の見た目は CI では確かめられない**（§27.5）
        run: cargo test --workspace

      - name: macOS の起動用を型検査する
        # Finder から開いたファイルを受け取る小さなアプリ（v2.1.0 R-08）。
        # **Swift は macOS でしか試せない**ので、ここで書き損じを拾う
        if: runner.os == 'macOS'
        run: swiftc -typecheck packaging/macos/launcher/main.swift

      # **配るものと同じ組み方で組む**（`--target` 付き）。GUI 試験もこれを試す。
      # 試験を通った実行ファイルそのものを包んで配る
      - name: ビルド
        run: cargo build --profile ${{ env.PROFILE }} --target ${{ matrix.target }}

      # --- GUI 試験（v2.1.0） ---
      #
      # 試験用の操作口（`--automation`）で、要件の項目を 1 つずつ確かめる
      # （doc/GUI自動テストの方針.md）。**窓が要る**ので、Linux は仮想の画面（Xvfb）で動かす。
      # Windows でしか確かめられない項目（最前面・作業領域）は、他の OS では「未確認」と出る
      - name: Linux の仮想の画面を用意する
        if: runner.os == 'Linux'
        # **xvfb だけでは窓が出ない。** winit は X11 で動くとき libxkbcommon-x11 を
        # 実行時に読み込む（dlopen）。ビルド依存の libxkbcommon-dev には含まれず、
        # ランナーにも入っていないため、起動直後に落ちて全項目が失敗していた
        run: sudo apt-get install -y xvfb libxkbcommon-x11-0

      - name: GUI 試験（要件の確認）
        shell: bash
        env:
          EXE: target/${{ matrix.target }}/${{ env.PROFILE }}/${{ matrix.binary }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/automation/spec_test.py --exe "$EXE" --shots gui-shots
          else
            python tools/automation/spec_test.py --exe "$EXE" --shots gui-shots
          fi

      - name: GUI 試験の画面写真を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-shots-${{ matrix.label }}
          path: gui-shots
          if-no-files-found: ignore

      # --- 配布物を組む（ここから下は、手で起動して Linux 以外を選んだときだけ） ---
      #
      # **公開側の ci.yml から写した。** 段の中身の理由は向こうの注釈を見る
      - name: 名前を付けて集める
        if: env.PACKAGE == 'true'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          mkdir -p dist
          name="mdview-${version}-${{ matrix.label }}"
          source="target/${{ matrix.target }}/${{ env.PROFILE }}/${{ matrix.binary }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$source" "dist/${name}.exe"
          else
            cp "$source" "dist/${name}"
            chmod +x "dist/${name}"
          fi
          ls -la dist

      # **`bash` を頭に付けて呼ぶ。** 実行ビットに頼らない（Windows で付けた索引は 100644）
      - name: deb を組む
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        run: |
          bash packaging/linux/build-deb.sh \
            "target/${{ matrix.target }}/${{ env.PROFILE }}/mdview" dist

      - name: AppImage を組む
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        run: |
          bash packaging/linux/build-appimage.sh \
            "target/${{ matrix.target }}/${{ env.PROFILE }}/mdview" dist

      - name: deb の煙試験
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        run: |
          set -eu
          package=$(ls dist/*.deb)
          echo "試す: $package"
          # `dpkg -i` ではなく `apt-get install ./…`（受け取った側と同じ経路。依存を取りに行く）
          sudo apt-get update >/dev/null
          sudo apt-get install -y "./$package"
          echo "依存: $(dpkg-deb -f "$package" Depends)"

          test -x /usr/bin/mdview || { echo "入ったはずの実行ファイルが無い"; exit 1; }
          version=$(/usr/bin/mdview --version)
          echo "起動できた: $version"
          expected="mdview $(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          [ "$version" = "$expected" ] || { echo "版数が違う: $version（期待: $expected）"; exit 1; }

          sudo apt-get install -y desktop-file-utils >/dev/null
          desktop-file-validate /usr/share/applications/mdview.desktop

          sudo dpkg -r mdview
          test ! -e /usr/bin/mdview || { echo "消したはずの実行ファイルが残っている"; exit 1; }
          echo "入れて・起動して・消せた"

      # **まっさらな環境（Debian 13）に依存だけを入れ、窓を出して描けるかを見る。**
      # `--init` を外さない（外すと Xvfb の準備完了の合図が届かずに永久に待つ）
      - name: まっさらな環境で deb を起動する
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          set -eu
          package=$(ls dist/*.deb)
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          docker run --rm --init -v "$PWD:/w" -w /w -e PACKAGE="$package" -e VERSION="$version" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            debian:13-slim bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends "./$PACKAGE" >/dev/null
              bash packaging/linux/check-runtime-libs.sh
              apt-get install -y -qq --no-install-recommends xvfb xauth python3 >/dev/null
              xvfb-run -a -s "-screen 0 1280x800x24" \
                python3 tools/automation/launch_check.py /usr/bin/mdview "$VERSION"'

      - name: AppImage の煙試験
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        run: |
          set -eu
          package=$(ls dist/*.AppImage)
          echo "試す: $package"
          # runner に FUSE が無いので展開して動かす
          APPIMAGE_EXTRACT_AND_RUN=1 "$package" --version

      - name: dmg を組む
        if: env.PACKAGE == 'true' && runner.os == 'macOS'
        run: |
          bash packaging/macos/build-dmg.sh \
            "target/${{ matrix.target }}/${{ env.PROFILE }}/mdview" dist

      - name: dmg の煙試験
        if: env.PACKAGE == 'true' && runner.os == 'macOS'
        run: |
          set -eu
          package=$(ls dist/*.dmg)
          echo "試す: $package"
          mount=$(mktemp -d)
          hdiutil attach "$package" -mountpoint "$mount" -nobrowse -quiet

          app="$mount/mdview.app"
          test -d "$app" || { echo "バンドルが無い"; exit 1; }
          editor="$app/Contents/Helpers/mdview.app"
          test -x "$app/Contents/MacOS/mdview" || { echo "起動用が無い"; exit 1; }
          test -x "$editor/Contents/MacOS/mdview" || { echo "本体が無い"; exit 1; }
          test -f "$app/Contents/Resources/mdview.icns" || { echo "アイコンが無い"; exit 1; }
          plutil -lint "$app/Contents/Info.plist"
          plutil -lint "$editor/Contents/Info.plist"
          outer=$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")
          inner=$(plutil -extract CFBundleIdentifier raw "$editor/Contents/Info.plist")
          [ "$outer" != "$inner" ] || { echo "バンドル ID が同じ: $outer"; exit 1; }
          "$editor/Contents/MacOS/mdview" --version
          "$app/Contents/MacOS/mdview" --version | grep -q "^mdview " \
            || { echo "起動用が本体へ引数を渡せない"; exit 1; }

          hdiutil detach "$mount" -quiet
          echo "開いて・起動できた"

      # **署名しない**（§27.4）。受け取った側の警告の外し方は Release の説明文に入れる
      - name: Inno Setup を入れる
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: インストーラを組む
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          packaging/windows/build-installer.ps1 `
            -SourceExe "target/${{ matrix.target }}/${{ env.PROFILE }}/mdview.exe" `
            -OutputDir dist

      # 入れて・起動して・消せるかを確かめる。答えは .NET の Process で受け取る
      # （本体は GUI のアプリなので `& $exe --version` では空になる）
      - name: 入れて消す煙試験
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Write-Host "試す: $($setup.Name)"

          Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\mdview\mdview.exe"
          if (-not (Test-Path $exe)) { throw "入ったはずの $exe が無い" }

          function Get-Answer([string]$Path, [string]$Argument) {
            $info = New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName = $Path
            $info.Arguments = $Argument
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.CreateNoWindow = $true
            $process = [System.Diagnostics.Process]::Start($info)
            $out = $process.StandardOutput.ReadToEnd()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "$Path $Argument が終了コード $($process.ExitCode) で終わった" }
            return $out.Trim()
          }

          $expected = "mdview " + ((Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value)
          $version = Get-Answer $exe '--version'
          Write-Host "起動できた: $version"
          if ($version -ne $expected) { throw "版数が違う: [$version]（期待: $expected）" }

          $console = "$env:LOCALAPPDATA\Programs\mdview\mdview.com"
          if (-not (Test-Path $console)) { throw "入ったはずの $console が無い" }
          $answer = Get-Answer $console '--version'
          Write-Host "端末用の入口: $answer"
          if ($answer -ne $expected) { throw "mdview.com の答えが違う: [$answer]（期待: $expected）" }

          $uninstall = Get-ChildItem "$env:LOCALAPPDATA\Programs\mdview\unins*.exe" |
            Select-Object -First 1
          Start-Process -FilePath $uninstall.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # 消えるまで待つ（アンインストーラは自分を写してすぐ戻るので `-Wait` が効かない）
          $deadline = (Get-Date).AddSeconds(60)
          while (((Test-Path $exe) -or (Test-Path $console)) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (Test-Path $exe) { throw "消したはずの $exe が 60 秒たっても残っている" }
          if (Test-Path $console) { throw "消したはずの $console が 60 秒たっても残っている" }
          Write-Host "入れて・起動して・消せた"

      # **release ジョブはこの名前で探す**
      - uses: actions/upload-artifact@v7
        if: env.PACKAGE == 'true'
        with:
          name: dist-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # **本体の Release を作る**（2026-10-15）。**手で起動して Linux 以外を選んだときだけ**走る。
  #
  # `check` が終わってから、一部の OS が落ちても走る（Windows がそろっていれば配る。
  # 欠けた OS は説明文の先頭に書く。tools/release/make-release.sh）。
  #
  # **名前は版数に英字を付ける**（`v2.2.1a`）。公開側の `v2.2.1` と区別するため。
  # 同じ版数で作り直すたびに次の英字にする（`b`、`c` …）ので、前のものは消さずに残る
  release:
    name: 本体の Release を作る
    needs: check
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (github.event.inputs.os != 'linux' || github.event.inputs.append_to != '') }}
    runs-on: ubuntu-latest
    permissions:
      # タグの push と Release の作成
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          # 足すときは、足す先のタグのコミットとソースを比べる（履歴が要る）
          fetch-depth: 0

      - name: 名前を決める
        id: version
        env:
          APPEND_TO: ${{ github.event.inputs.append_to }}
        run: |
          set -eu
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)

          # --- あとから足す（v2.2.1a へ Linux 版を載せる など） ---
          if [ -n "$APPEND_TO" ]; then
            tag="$APPEND_TO"
            case "$tag" in
              "v${version}"[a-z]) ;;
              *) echo "足す先は本体の Release の名前（v${version} に英字を付けたもの）: $tag"; exit 1 ;;
            esac
            gh release view "$tag" --json tagName > /dev/null \
              || { echo "足す先の Release が無い: $tag"; exit 1; }
            # **そのタグとアプリのソースが同じときだけ足す**（違うソースの物を混ぜない）。
            # コミットそのものは比べない。タグから起動すると、そのコミットの古い ci.yml
            # （足す機能が無い）で動いてしまうため。CI や文書だけを直したコミットからは足せる
            git fetch --quiet --tags origin
            commit=$(git rev-list -n 1 "$tag")
            sources="src core Cargo.toml Cargo.lock build.rs rust-toolchain.toml packaging assets examples"
            if ! git diff --quiet "$commit" "$GITHUB_SHA" -- $sources; then
              echo "$tag（$commit）から、アプリのソースが変わっている。足せない:"
              git diff --stat "$commit" "$GITHUB_SHA" -- $sources | tail -n 20
              echo "版数を上げて新しく作るか、$tag と同じソースのコミットから起動する"
              exit 1
            fi
            echo "足す先: $tag（$commit。この実行 $GITHUB_SHA とアプリのソースは同じ）"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "append=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # **使った英字は、タグと Release（下書きを含む）の両方から拾う**。下書きはタグを持たない
          used=$(
            {
              git ls-remote --tags origin "refs/tags/v${version}*" | sed 's#.*refs/tags/##'
              gh release list --limit 200 --json tagName --jq '.[].tagName'
            } | grep -E "^v${version//./\\.}[a-z]$" | sed "s/^v${version}//" | sort -u || true
          )
          # **使った中でいちばん後ろの英字の次**にする（消したものの穴は埋めない。新しいほど後ろの英字）
          last=$(printf '%s\n' "$used" | grep -E '^[a-z]$' | tail -n 1 || true)
          tag=""
          seen=""
          [ -z "$last" ] && seen=yes
          for letter in a b c d e f g h i j k l m n o p q r s t u v w x y z; do
            if [ -n "$seen" ]; then
              tag="v${version}${letter}"
              break
            fi
            [ "$letter" = "$last" ] && seen=yes
          done
          if [ -z "$tag" ]; then
            echo "v${version}a〜z を使い切った。版数を上げる"
            exit 1
          fi
          echo "使った英字: ${used:-（無し）} → $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "append=false" >> "$GITHUB_OUTPUT"

      # **足すときは、もとから載っている物も手元へ落とす**。照合値と説明文を全部で作り直すため。
      # この実行の配布物を後から落とすので、同じ名前の物（組み直した OS）はこの実行の物が勝つ
      - name: 足す先の配布物を落とす
        if: steps.version.outputs.append == 'true'
        run: |
          set -eu
          mkdir -p dist
          gh release download "${{ steps.version.outputs.tag }}" --dir dist --pattern 'mdview-*'
          ls -la dist

      - name: この実行の配布物を落とす
        # 全部の OS が落ちていると 1 つも無い。そのときは次の段が理由を出して止める
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: 検査・照合値・説明文
        env:
          # **選ばなかった OS は失敗ではない**（説明文の断り書きの理由を差し替える）
          ABSENT_REASON: "この Release では選んだ OS（${{ github.event.inputs.os }}）だけを組みました。選んでいない OS が落ちた場合も、ここに出ます。"
        run: |
          bash tools/release/make-release.sh "${{ steps.version.outputs.tag }}" dist
          # **本体の Release であることを先頭に書く**（公開側の Release と取り違えない）
          {
            if [ "${{ steps.version.outputs.append }}" = "true" ]; then
              echo "> **本体（開発用）の Release です。** 手で起動した CI が組みました（あとから ${{ github.event.inputs.os }} を足しました）。"
            else
              echo "> **本体（開発用）の Release です。** 手で起動した CI（${{ github.event.inputs.os }}）が組みました。"
            fi
            echo "> 公開側の \`v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)\` とは別のものです。"
            echo
            cat release-notes.md
          } > release-notes.tmp
          mv release-notes.tmp release-notes.md

      - name: タグを打って Release を作る
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APPEND: ${{ steps.version.outputs.append }}
        run: |
          set -eu
          # **足すときは、載せ直して説明文を差し替えるだけ**（タグは既にある）。
          # `--clobber` で同じ名前の物（照合値・組み直した OS）を置き換える
          if [ "$APPEND" = "true" ]; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
            echo "足した: $(gh release view "$TAG" --json url --jq .url)"
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 0
          fi
          # **この実行のコミットが main の先頭でなければ止める**（2026-10-20）。Actions のトークンは
          # ブランチの先頭でないコミットへタグを打てず、Release を作る呼び出しが
          # `HTTP 403: Resource not accessible by integration` で拒まれる（v2.3.0b で 3 回踏んだ。
          # 走っている間に main へ push した）。組んだ物はこの実行の成果物に残っている
          head=$(git ls-remote origin refs/heads/main | cut -f 1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "この実行のコミット（$GITHUB_SHA）が main の先頭（$head）ではない。"
            echo "Actions のトークンでは、先頭でないコミットに Release を作れない（403 になる）。"
            echo "main の先頭から手動起動し直すか、この実行の成果物から手元の gh で作る（リリース手順 §7）"
            exit 1
          fi
          # **下書きで作って全部載せてから、公開する。** 公開したときに、この実行のコミット
          # （試験して包んだもの）へタグが出来る。途中で止まっても、欠けた Release が
          # 公開されたり、タグだけが残ったりしない
          gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file release-notes.md
          gh release edit "$TAG" --draft=false
          echo "作った: $(gh release view "$TAG" --json url --jq .url)"
